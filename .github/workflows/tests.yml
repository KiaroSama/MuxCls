name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary target (robocopy path); Linux proves the
        # stdlib copy path that runs everywhere else.
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Compile check
        shell: pwsh
        run: |
          # pwsh does not expand globs for a program, so build the list first.
          $files = @("MuxCls.py") + (Get-ChildItem muxcls/*.py | ForEach-Object FullName)
          python -m py_compile @files

      - name: Entry-point smoke test
        shell: pwsh
        run: |
          "quit" | python MuxCls.py
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Entry point exited with code $LASTEXITCODE"
            exit 1
          }

      - name: Run test suite
        run: python -m pytest tests -v
