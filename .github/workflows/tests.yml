name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary target (robocopy path); Linux proves the
        # stdlib copy path that runs everywhere else.
        os: [windows-latest, ubuntu-latest]
        # The README asks only for "Python 3", so the oldest and newest
        # supported interpreters both have to be proven, not assumed. The
        # middle version only runs on Linux - it would triple the Windows
        # jobs for a combination the other two already bracket.
        python-version: ["3.11", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      # choco exits 0 when the community feed times out and it installed nothing
      # ("Chocolatey installed 0/0 packages" after a 504). The missing tool then
      # surfaced three steps later as "Entry point exited with code 1", which
      # reads as a MuxCls defect rather than a runner that has no FFmpeg. Retry
      # the transient feed error, then prove both tools actually resolve.
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($attempt in 1..3) {
            choco install ffmpeg -y --no-progress
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { break }
            Write-Host "::warning::ffmpeg not resolvable after choco attempt $attempt"
            if ($attempt -lt 3) { Start-Sleep -Seconds 20 }
          }
          foreach ($tool in 'ffmpeg', 'ffprobe') {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "$tool is still not on PATH after installing FFmpeg"
            }
          }
          ffmpeg -version | Select-Object -First 1

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          command -v ffmpeg && command -v ffprobe

      # Lint and typecheck run once, on the primary combination only: they read
      # the same source on every runner, so repeating them across the matrix
      # would spend five jobs proving one thing.
      - name: Lint
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: python -m ruff check muxcls tests MuxCls.py

      # Both platforms, because the source is platform-gated: a Windows-only API
      # behind a `sys.platform` guard is invisible to a linux check, and code the
      # users actually run is only seen by the win32 one. mypy narrows on
      # `sys.platform`, so each pass type-checks a different half of those guards.
      - name: Typecheck
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: |
          python -m mypy muxcls MuxCls.py --ignore-missing-imports --platform linux
          python -m mypy muxcls MuxCls.py --ignore-missing-imports --platform win32

      - name: Compile check
        shell: pwsh
        run: |
          # pwsh does not expand globs for a program, so build the list first.
          $files = @("MuxCls.py") + (Get-ChildItem muxcls/*.py | ForEach-Object FullName)
          python -m py_compile @files

      - name: Entry-point smoke test
        shell: pwsh
        run: |
          "quit" | python MuxCls.py
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Entry point exited with code $LASTEXITCODE"
            exit 1
          }

      - name: Run test suite
        run: python -m pytest tests -v --cov=muxcls --cov-report=term-missing

      # A test FILE that never starts is identical to success in every number
      # except how many cases were COLLECTED: nothing goes red, the totals are
      # simply short. Every leg runs the same suite on the same commit, so the
      # legs must agree with each other - no stored baseline to maintain, and
      # adding tests never breaks it while losing a file on one leg always does.
      - name: Record collected count
        run: python -m pytest tests --collect-only -q > collected.txt
      - name: Upload collected count
        uses: actions/upload-artifact@v7
        with:
          name: collected-${{ matrix.os }}-py${{ matrix.python-version }}
          path: collected.txt
          retention-days: 1

      # The coverage number is reported, never enforced. A threshold here would
      # reward tests written to move a percentage; the missing-line list is what
      # actually tells a reviewer which paths nothing exercises.
      - name: Coverage summary
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  # Guards against a suite silently shrinking on one leg only. Skips may
  # legitimately differ between platforms and are reported, never gated; the
  # collected total may not differ at all.
  collected-agreement:
    name: every leg collected the same tests
    needs: test
    if: always() && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download every leg's count
        uses: actions/download-artifact@v8
        with:
          pattern: collected-*
          path: counts

      - name: Compare
        shell: python
        run: |
          import pathlib, re, sys

          files = sorted(pathlib.Path("counts").glob("*/collected.txt"))
          if not files:
              sys.exit("no collected-count artifacts were downloaded")

          counts = {}
          for path in files:
              text = path.read_text(encoding="utf-8", errors="replace")
              match = re.search(r"^(\d+)\s+tests?\s+collected", text, re.MULTILINE)
              if not match:
                  sys.exit("could not read a collected count from " + path.parent.name)
              counts[path.parent.name] = int(match.group(1))

          for leg, value in sorted(counts.items()):
              print(leg, "collected", value)

          distinct = set(counts.values())
          if len(distinct) != 1:
              sys.exit(
                  "legs disagree on how many tests were collected: "
                  + repr(sorted(counts.items()))
                  + " - a test file is missing or failed to import on at least one leg"
              )
          print("all", len(counts), "legs collected", distinct.pop(), "tests")
