<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuxCls — Manual QA</title>
<style>
:root{
  /* Palette taken from muxcls/colors.py (the app's own ANSI truecolor values). */
  --scan:#44DDFF; --summary:#AAFF52; --verify:#FF73E1; --note:#50BEFF;
  --confirm:#FF9B3C; --process:#50FFCD; --done:#91FF5F; --process-done:#5AFF87;
  --found-label:#5AFFBE; --found-value:#FFEB78; --example:#FFD750;
  --sep:#4B82BE; --setting-label:#6ED2FF; --input-path:#46FFD2; --output-base:#FF69B4;
  --output-root:#BEFF46; --mode:#B491FF; --audio:#78FFAA; --subtitle:#FF96DC;
  --true:#5FFF78; --false:#FF5F5F; --failed:#FF3C48; --extra-failed:#FF5F78;
  --size:#00AA7D; --elapsed:#CD7A2A; --log:#FFF04A; --file-red:#FF1414;

  --bg:#0f1419; --bg2:#151b22; --bg3:#1b232c; --line:#26303b;
  --fg:#e6edf3; --fg-dim:#93a1b1; --fg-faint:#6b7a8c;
  --pass:#5FFF78; --fail:#FF3C48; --na:#93a1b1;
  --radius:10px;
  --font-fa:"Vazirmatn","Segoe UI","Tahoma","Iranian Sans",system-ui,sans-serif;
  --font-en:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-code:ui-monospace,"Cascadia Mono","Consolas","SF Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--font-en);line-height:1.75;font-size:15px}
body[data-lang="fa"]{font-family:var(--font-fa);direction:rtl}
body[data-lang="en"]{direction:ltr}

code,kbd,.mono,.id{font-family:var(--font-code);direction:ltr;unicode-bidi:isolate}
code{background:var(--bg3);border:1px solid var(--line);border-radius:5px;padding:.08em .38em;font-size:.88em;color:var(--found-value)}

.layout{display:grid;grid-template-columns:280px 1fr;gap:0;min-height:100vh}
#toc{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;background:var(--bg2);border-inline-end:1px solid var(--line);padding:18px 14px}
#toc h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-faint);margin:0 0 10px}
#toc a{display:block;padding:6px 10px;border-radius:7px;color:var(--fg-dim);text-decoration:none;font-size:13.5px;border-inline-start:3px solid transparent}
#toc a:hover{background:var(--bg3);color:var(--fg)}
#toc a.active{background:var(--bg3);color:var(--scan);border-inline-start-color:var(--scan)}
main{padding:0 26px 90px;max-width:1180px}

header.head{padding:30px 0 14px}
h1{margin:0 0 6px;font-size:27px;color:var(--scan)}
.sub{color:var(--fg-dim);margin:0 0 14px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{background:var(--bg3);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--fg-dim)}
.chip b{color:var(--fg)}

#bar{position:sticky;top:0;z-index:30;background:rgba(15,20,25,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:14px}
.barrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.track{flex:1 1 220px;height:9px;border-radius:99px;background:var(--bg3);overflow:hidden;display:flex;min-width:160px}
.track i{display:block;height:100%}
.track .p{background:var(--pass)} .track .f{background:var(--fail)} .track .n{background:var(--na)}
.counts{display:flex;gap:7px;flex-wrap:wrap;font-size:12.5px}
.counts span{background:var(--bg3);border:1px solid var(--line);border-radius:7px;padding:2px 9px}
.counts .cp{color:var(--pass)} .counts .cf{color:var(--fail)} .counts .cn{color:var(--na)} .counts .cr{color:var(--fg-dim)}
input[type=search],select,button{font:inherit;background:var(--bg3);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 11px}
input[type=search]{min-width:170px;flex:1 1 190px}
button{cursor:pointer}
button:hover{border-color:var(--scan)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--scan);outline-offset:2px}
.danger:hover{border-color:var(--fail);color:var(--fail)}

section.sec{margin:22px 0;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg2);overflow:hidden;scroll-margin-top:82px}
.sechead{display:flex;gap:12px;align-items:center;padding:13px 16px;cursor:pointer;background:var(--bg2)}
.sechead:hover{background:var(--bg3)}
.sechead h2{margin:0;font-size:17px;flex:1;color:var(--process)}
.sechead .mini{width:96px;height:6px;border-radius:99px;background:var(--bg3);overflow:hidden;display:flex;flex:0 0 auto}
.sechead .dt{font-size:12.5px;color:var(--fg-faint);min-width:56px;text-align:end}
.caret{color:var(--fg-faint);transition:transform .18s}
section.sec.collapsed .body{display:none}
section.sec.collapsed .caret{transform:rotate(-90deg)}
body[data-lang="fa"] section.sec.collapsed .caret{transform:rotate(90deg)}
.body{padding:0 16px 16px}
.subhead{margin:18px 0 8px;font-size:14.5px;color:var(--found-label);font-weight:600}
.intro{color:var(--fg-dim);font-size:14px;margin:8px 0 4px}

table{width:100%;border-collapse:separate;border-spacing:0 7px}
th{text-align:start;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-faint);padding:0 12px;font-weight:600}
td{background:var(--bg3);border-block:1px solid var(--line);padding:11px 12px;vertical-align:top;font-size:14.2px}
td:first-child{border-inline-start:1px solid var(--line);border-start-start-radius:9px;border-end-start-radius:9px}
td:last-child{border-inline-end:1px solid var(--line);border-start-end-radius:9px;border-end-end-radius:9px}
tr.row[data-state="pass"] td{background:#12251a;border-color:#1f5c33}
tr.row[data-state="fail"] td{background:#2a1417;border-color:#6b2028}
tr.row[data-state="na"] td{background:#1a1f25;border-color:#33404d;opacity:.72}
tr.hidden{display:none}
.id{color:var(--example);font-size:12.5px;white-space:nowrap}
.acts{display:flex;gap:5px}
.acts button{padding:3px 10px;font-size:13px;line-height:1.5}
.acts button.on[data-v="pass"]{background:var(--pass);color:#062a10;border-color:var(--pass)}
.acts button.on[data-v="fail"]{background:var(--fail);color:#2a0509;border-color:var(--fail)}
.acts button.on[data-v="na"]{background:var(--na);color:#10151a;border-color:var(--na)}
.note{margin-top:8px;padding:8px 11px;border-radius:8px;font-size:13.2px;border-inline-start:3px solid}
.note.info{background:#0e1f2b;border-color:var(--note);color:#bfe3ff}
.note.warn{background:#2a2210;border-color:var(--confirm);color:#ffdfae}
.note.danger{background:#2b1013;border-color:var(--failed);color:#ffc2c7}
.setup td:first-child{color:var(--setting-label)}
.tag{font-size:11.5px;border-radius:6px;padding:1px 7px;border:1px solid var(--line);color:var(--fg-faint);white-space:nowrap}

#top{position:fixed;inset-block-end:20px;inset-inline-end:20px;z-index:40;border-radius:50%;width:42px;height:42px;display:none}
#top.show{display:block}
.empty{padding:26px;text-align:center;color:var(--fg-faint)}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  #toc{position:static;height:auto;border-inline-end:0;border-bottom:1px solid var(--line)}
  #bar{position:static}
  main{padding:0 14px 70px}
  table,thead,tbody,tr,td,th{display:block;width:100%}
  thead{display:none}
  td{border:1px solid var(--line)!important;border-radius:9px!important;margin-bottom:5px}
  tr.row{display:block;margin-bottom:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{
  #toc,#bar,#top,.acts{display:none!important}
  section.sec.collapsed .body{display:block!important}
  body{background:#fff;color:#000}
  td{background:#fff;border:1px solid #999}
  .layout{display:block}
}
</style>

<div class="layout">
  <nav id="toc" aria-label="Sections"><h2 id="tocTitle">Sections</h2><div id="tocLinks"></div></nav>
  <main>
    <header class="head">
      <h1 id="docTitle"></h1>
      <p class="sub" id="docSub"></p>
      <div class="meta" id="docMeta"></div>
    </header>

    <div id="bar">
      <div class="barrow">
        <div class="track" aria-hidden="true"><i class="p" id="tp"></i><i class="f" id="tf"></i><i class="n" id="tn"></i></div>
        <div class="counts">
          <span class="cp" id="cp"></span><span class="cf" id="cf"></span>
          <span class="cn" id="cn"></span><span class="cr" id="cr"></span>
        </div>
      </div>
      <div class="barrow" style="margin-top:8px">
        <input type="search" id="q" autocomplete="off">
        <select id="filter"></select>
        <button id="btnLang" type="button"></button>
        <button id="btnExpand" type="button"></button>
        <button id="btnReset" class="danger" type="button"></button>
      </div>
    </div>

    <div id="out"></div>
    <div class="empty" id="empty" hidden></div>
  </main>
</div>
<button id="top" title="Top" type="button">↑</button>

<script>
/* ============================================================================
   MuxCls - Manual QA
   Everything below renders from ONE data model. Adding a test = adding one row.
   All model text reaches the DOM through textContent, so the document itself
   cannot be injected into.
   ========================================================================= */

const STORE_KEY = "muxcls.manualqa.v1";
const LANG_KEY  = "muxcls.manualqa.lang.v1";

const UI = {
  title:   {fa:"MuxCls — سند تست دستی", en:"MuxCls — Manual QA"},
  sub:     {fa:"هر انتظار قابل‌داوری است: یک عدد، یک متن دقیق، یا وجود/نبود یک فایل. «درست کار می‌کند» انتظار نیست.",
            en:"Every expectation is judgeable: a number, an exact string, or the presence/absence of a file. \"works correctly\" is not an expectation."},

  reset:   {fa:"پاک کردن نتایج", en:"Reset all"},

  colAction:{fa:"عمل", en:"Action"},

  colNormal:{fa:"مقدار عادی", en:"Normal value"},
  colTest: {fa:"مقدار پیشنهادی تست", en:"Suggested test value"},
  colWhy:  {fa:"چرا", en:"Why"},
  langBtn: {fa:"English", en:"فارسی"},
  none:    {fa:"چیزی پیدا نشد.", en:"Nothing matched."},
  version: {fa:"نسخه", en:"Version"},
  commit:  {fa:"کامیت", en:"Commit"},
  tests:   {fa:"تست", en:"tests"},
  secs:    {fa:"بخش", en:"sections"}
};

const META = {version:"1.4.2", commit:"dd52537"};

/* ---------- Section 0: environment setup (informational, not scored) ------ */
const SETUP = {
  title: {fa:"۰ — آماده‌سازی محیط", en:"0 — Environment setup"},
  intro: {fa:"قبل از شروع این‌ها را تنظیم کن. ستون «چرا» توضیح می‌دهد که بدون آن، کدام تست عملاً غیرقابل‌اجرا می‌شود.",
          en:"Set these before testing. The \"Why\" column says which test becomes impractical without the change."},
  rows: [
    {s:"MUXCLS_OPERATION_TIMEOUT", n:{fa:"تنظیم‌نشده (۳ ساعت)", en:"unset (3 hours)"}, t:"5",
     w:{fa:"سقف زمانی هر remux/کپی. با ۵ ثانیه می‌توانی مسیر timeout را روی یک فایل بزرگ واقعی ببینی بدون اینکه ۳ ساعت صبر کنی. مقدار ۰ سقف را کاملاً غیرفعال می‌کند.",
        en:"Wall ceiling for one remux/copy. At 5 you can watch the timeout path on a real large file instead of waiting 3 hours. 0 disables the bound entirely."}},
    {s:"MUXCLS_DEBUG", n:{fa:"تنظیم‌نشده (سطح INFO)", en:"unset (INFO level)"}, t:"1",
     w:{fa:"لاگ کامل: خط فرمان هر دستور و خروجی دستورهای موفق. برای تست‌های بخش لاگ لازم است.",
        en:"Verbose log: every command line plus the output of successful commands. Required by the logging tests."}},
    {s:{fa:"پوشهٔ نمونه", en:"Sample folder"}, n:{fa:"—", en:"—"}, t:{fa:"۳ تا ۵ فایل با دو زبان صدا و چند زیرنویس", en:"3–5 files, dual audio, several subtitles"},
     w:{fa:"بیشتر تست‌های انتخاب استریم به فایلی نیاز دارند که بیش از یک تراک صدا و چند زیرنویس با عنوان متفاوت داشته باشد.",
        en:"Most selection tests need a file with more than one audio track and several differently-titled subtitles."}},
    {s:{fa:"فایل کوتاه‌شده", en:"Trimmed fixture"}, n:{fa:"—", en:"—"}, t:"ffmpeg -t 45 -i SRC -map 0 -c copy DST.mkv",
     w:{fa:"ساختار واقعی (کدک، تگ زبان، disposition، ضمیمه‌های فونت) را نگه می‌دارد ولی حجم را ~۲۰ برابر کم می‌کند؛ چرخهٔ تست کوتاه می‌شود.",
        en:"Keeps the real structure (codecs, language tags, dispositions, font attachments) at ~1/20 the size, so the test loop stays short."}},
    {s:{fa:"فایل خراب", en:"Broken file"}, n:{fa:"—", en:"—"}, t:"head -c 4000 real.mkv > broken.mkv",
     w:{fa:"برای تست مسیر شکست ffprobe لازم است؛ هدر واقعی دارد ولی ناقص است.", en:"Needed for the ffprobe-failure path: a real header that is genuinely truncated."}},
    {s:{fa:"فایل بدون ویدیو", en:"No-video file"}, n:{fa:"—", en:"—"}, t:"ffmpeg -i SRC -map 0:a:0 -c copy audio_only.mkv",

        en:"MuxCls never modifies its input, so a reset means deleting the output. Never delete the source folder."}}
  ]
};

/* ---------------------------- Test model --------------------------------- */
/* r(id, action, expectation, note?) - note = {kind:"info|warn|danger", fa, en} */
const S = [

{n:1, t:{fa:"راه‌اندازی و پیش‌نیازها", en:"Startup and prerequisites"}, subs:[

  {a:{fa:"ffprobe را از PATH بردار (ffmpeg بماند).", en:"Remove ffprobe from PATH (keep ffmpeg)."},
   e:{fa:"«ERROR: ffprobe was not found in PATH.» و کد خروج ۱.", en:"\"ERROR: ffprobe was not found in PATH.\" and exit code 1."}},
  {a:{fa:"روی لینوکس/مک بدون robocopy اجرا کن.", en:"Run on Linux/macOS where robocopy does not exist."},
   e:{fa:"هیچ خطایی دربارهٔ robocopy داده نمی‌شود؛ برنامه عادی بالا می‌آید.", en:"No robocopy error at all; the program starts normally."},
   note:{kind:"info", fa:"robocopy فقط روی ویندوز استفاده می‌شود؛ بقیهٔ سکوها با کتابخانهٔ استاندارد کپی می‌کنند.",
         en:"robocopy is used on Windows only; every other platform copies with the standard library."}}
 ]},
 {n:2, t:{fa:"لاگ اولیه", en:"Initial log"}, rows:[
  {a:{fa:"بعد از اجرا پوشهٔ Logs/ را ببین.", en:"Look at Logs/ after a run."},
   e:{fa:"یک فایل تازه با الگوی muxcls_YYYY-MM-DD_HH-mm-ss_UTC.log ساخته شده و فایل قبلی دست‌نخورده مانده.",

  {a:{fa:"خط اول لاگ را بخوان.", en:"Read the first log line."},

  {a:{fa:"ساعت لاگ را با ساعت محلی مقایسه کن (اگر منطقهٔ زمانی‌ات UTC نیست).", en:"Compare the log clock with local time (if your timezone is not UTC)."},

  {a:{fa:"پوشهٔ Logs را فقط‌خواندنی کن و اجرا کن.", en:"Make the Logs folder read-only and run."},
   e:{fa:"«Logging disabled: …» چاپ می‌شود و برنامه ادامه می‌دهد — کرش نمی‌کند.",

 ]}
]},

{n:2, t:{fa:"مسیر ورودی و کشف فایل", en:"Input path and discovery"}, subs:[
 {n:1, t:{fa:"پذیرش مسیر", en:"Path acceptance"}, rows:[
  {a:{fa:"مسیر پوشه را با drag & drop وارد کن (با گیومه).", en:"Drag & drop a folder path (it arrives quoted)."},
   e:{fa:"گیومه‌ها حذف می‌شوند و مسیر پذیرفته می‌شود.", en:"The quotes are stripped and the path is accepted."}},

 ]},
 {n:2, t:{fa:"کشف فایل‌ها", en:"File discovery"}, rows:[
  {a:{fa:"پوشه‌ای با زیرپوشه‌های تودرتو بده.", en:"Give a folder with nested subfolders."},
   e:{fa:"«Found N video file(s).» که N شامل فایل‌های زیرپوشه‌ها هم هست.", en:"\"Found N video file(s).\" where N includes files in subfolders."}},
  {a:{fa:"پوشه‌ای فقط با فایل‌های .txt و .jpg بده.", en:"Give a folder containing only .txt and .jpg files."},

    {c:{fa:"خروجی به فایل هدایت شود", en:"output redirected to a file"}, m:{fa:"بدون آشغال \\r و بدون خط پیشرفت", en:"no \\r noise and no progress line"}, r:"12.1.2"},
    {c:{fa:"منبع فقط‌خواندنی روی POSIX", en:"read-only source on POSIX"}, m:{fa:"اجرای بعدی با Overwrite موفق است", en:"the next Overwrite run succeeds"}, r:"15.1.3"}

/* ------------------------------- Rendering ------------------------------- */
let lang = localStorage.getItem(LANG_KEY) || "fa";
let state = {};
try { state = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (e) { state = {}; }

const T = (v) => (v && typeof v === "object" && (v.fa || v.en)) ? (v[lang] || v.en || v.fa) : (v == null ? "" : String(v));
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;   // textContent everywhere: no injection
  return n;
};

function rowId(s, sub, i){ return s.n + "." + sub.n + "." + (i + 1); }

function allRows(){
  const out = [];
  S.forEach(s => s.subs.forEach(sub => sub.rows.forEach((r, i) => out.push({s, sub, r, id: rowId(s, sub, i)}))));
  return out;
}
const TOTAL = allRows().length;

function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

function buildSetup(){
  const sec = el("section", "sec");
  sec.id = "sec-0";
  const head = el("div", "sechead");
  head.append(el("span", "caret", "▾"), el("h2", null, T(SETUP.title)));
  head.addEventListener("click", () => sec.classList.toggle("collapsed"));
  const body = el("div", "body");
  body.append(el("p", "intro", T(SETUP.intro)));
  const tbl = el("table", "setup");
  const thead = el("thead"), htr = el("tr");
  [UI.colSetting, UI.colNormal, UI.colTest, UI.colWhy].forEach(h => htr.append(el("th", null, T(h))));
  thead.append(htr); tbl.append(thead);
  const tb = el("tbody");
  SETUP.rows.forEach(r => {
    const tr = el("tr");
    const c1 = el("td"); c1.append(el("code", null, T(r.s))); tr.append(c1);
    tr.append(el("td", null, T(r.n)));
    const c3 = el("td"); c3.append(el("code", null, T(r.t))); tr.append(c3);
    tr.append(el("td", null, T(r.w)));
    tb.append(tr);
  });
  tbl.append(tb); body.append(tbl); sec.append(head, body);
  return sec;
}

function buildRow(id, r){
  const tr = el("tr", "row");
  tr.dataset.id = id;
  tr.dataset.state = state[id] || "";

  const tdA = el("td");
  tdA.append(el("div", "id", id));
  tdA.append(el("div", null, T(r.a)));
  const acts = el("div", "acts");
  [["pass", "✓"], ["fail", "✕"], ["na", "–"]].forEach(([v, glyph]) => {
    const b = el("button", null, glyph);
    b.type = "button";
    b.dataset.v = v;
    b.setAttribute("aria-label", T(UI[v]) + " " + id);
    if (state[id] === v) b.classList.add("on");
    b.addEventListener("click", () => {
      state[id] = (state[id] === v) ? "" : v;
      if (!state[id]) delete state[id];
      save(); refresh();
    });
    acts.append(b);
  });
  tdA.append(acts);

  const tdE = el("td");
  tdE.append(el("div", null, T(r.e)));
  if (r.note) tdE.append(el("div", "note " + (r.note.kind || "info"), T(r.note)));

  tr.append(tdA, tdE);
  return tr;
}

function buildSection(s){
  const sec = el("section", "sec");
  sec.id = "sec-" + s.n;
  const head = el("div", "sechead");
  head.append(el("span", "caret", "▾"), el("h2", null, s.n + " — " + T(s.t)));
  const mini = el("div", "mini");
  const mp = el("i", "p"), mf = el("i", "f"), mn = el("i", "n");
  mini.append(mp, mf, mn);
  const dt = el("div", "dt");
  head.append(mini, dt);
  head.addEventListener("click", () => sec.classList.toggle("collapsed"));

  const body = el("div", "body");
  s.subs.forEach(sub => {
    body.append(el("div", "subhead", s.n + "." + sub.n + " " + T(sub.t)));
    const tbl = el("table");
    const thead = el("thead"), htr = el("tr");
    htr.append(el("th", null, T(UI.colAction)), el("th", null, T(UI.colExpect)));
    thead.append(htr); tbl.append(thead);
    const tb = el("tbody");
    sub.rows.forEach((r, i) => tb.append(buildRow(rowId(s, sub, i), r)));
    tbl.append(tb); body.append(tbl);
  });

  sec.append(head, body);
  sec._mini = {mp, mf, mn, dt};
  return sec;
}

function buildDigest(id, d, kind){
  const sec = el("section", "sec");
  sec.id = id;
  const head = el("div", "sechead");
  head.append(el("span", "caret", "▾"), el("h2", null, T(d.title)));
  head.addEventListener("click", () => sec.classList.toggle("collapsed"));
  const body = el("div", "body");
  body.append(el("p", "intro", T(d.intro)));
  const tbl = el("table");
  const thead = el("thead"), htr = el("tr");
  htr.append(el("th", null, T(UI.colInput)), el("th", null, T(UI.colExpect)), el("th", null, "ID"));
  thead.append(htr); tbl.append(thead);
  const tb = el("tbody");
  d.rows.forEach(r => {
    const tr = el("tr");
    tr.append(el("td", null, T(r.c)));
    const tdM = el("td");
    if (typeof r.m === "string") tdM.append(el("code", null, r.m)); else tdM.append(document.createTextNode(T(r.m)));
    tr.append(tdM);
    const tdR = el("td"); tdR.append(el("span", "id", r.r)); tr.append(tdR);
    tb.append(tr);
  });
  tbl.append(tb); body.append(tbl);
  sec.append(head, body);
  return sec;
}

function render(){
  document.body.dataset.lang = lang;
  document.documentElement.lang = lang;
  document.getElementById("docTitle").textContent = T(UI.title);
  document.getElementById("docSub").textContent = T(UI.sub);
  document.getElementById("tocTitle").textContent = T(UI.sections);
  document.getElementById("q").placeholder = T(UI.search);
  document.getElementById("btnLang").textContent = T(UI.langBtn);
  document.getElementById("btnExpand").textContent = T(UI.expand);
  document.getElementById("btnReset").textContent = T(UI.reset);
  document.getElementById("empty").textContent = T(UI.none);

  const meta = document.getElementById("docMeta");
  meta.textContent = "";
  [[T(UI.version), META.version], [T(UI.commit), META.commit],
   [T(UI.tests), String(TOTAL)], [T(UI.secs), String(S.length)]].forEach(([k, v]) => {
    const c = el("span", "chip"); c.append(document.createTextNode(k + ": ")); c.append(el("b", null, v)); meta.append(c);
  });

  const f = document.getElementById("filter");
  const keep = f.value || "all";
  f.textContent = "";
  [["all", UI.all], ["notdone", UI.notdone], ["pass", UI.pass], ["fail", UI.fail], ["na", UI.na]]
    .forEach(([v, label]) => { const o = el("option", null, T(label)); o.value = v; f.append(o); });
  f.value = keep;

  const out = document.getElementById("out");
  out.textContent = "";
  out.append(buildSetup());
  S.forEach(s => out.append(buildSection(s)));
  out.append(buildDigest("digest-must", MUST, "danger"));
  out.append(buildDigest("digest-maynot", MAYNOT, "info"));

  const links = document.getElementById("tocLinks");
  links.textContent = "";
  const a0 = el("a", null, T(SETUP.title)); a0.href = "#sec-0"; links.append(a0);
  S.forEach(s => { const a = el("a", null, s.n + " — " + T(s.t)); a.href = "#sec-" + s.n; links.append(a); });
  [["digest-must", MUST], ["digest-maynot", MAYNOT]].forEach(([id, d]) => {
    const a = el("a", null, T(d.title)); a.href = "#" + id; links.append(a);
  });

  refresh();
}

function refresh(){
  const q = (document.getElementById("q").value || "").trim().toLowerCase();
  const mode = document.getElementById("filter").value || "all";
  let pass = 0, fail = 0, na = 0, shown = 0;

  S.forEach(s => {
    const sec = document.getElementById("sec-" + s.n);
    let sp = 0, sf = 0, sn = 0, stotal = 0, visible = 0;
    sec.querySelectorAll("tr.row").forEach(tr => {
      const st = state[tr.dataset.id] || "";
      tr.dataset.state = st;
      tr.querySelectorAll(".acts button").forEach(b => b.classList.toggle("on", b.dataset.v === st));
      stotal++;
      if (st === "pass") sp++; else if (st === "fail") sf++; else if (st === "na") sn++;

      const text = tr.textContent.toLowerCase();
      const okQ = !q || text.includes(q);
      const okF = mode === "all" || (mode === "notdone" ? !st : st === mode);
      const vis = okQ && okF;
      tr.classList.toggle("hidden", !vis);
      if (vis) visible++;
    });
    pass += sp; fail += sf; na += sn; shown += visible;
    sec.hidden = visible === 0 && (q !== "" || mode !== "all");
    const done = sp + sf + sn;
    const m = sec._mini;
    if (m){
      m.mp.style.width = (stotal ? sp / stotal * 100 : 0) + "%";
      m.mf.style.width = (stotal ? sf / stotal * 100 : 0) + "%";
      m.mn.style.width = (stotal ? sn / stotal * 100 : 0) + "%";
      m.dt.textContent = done + "/" + stotal;
    }
  });

  document.getElementById("tp").style.width = (pass / TOTAL * 100) + "%";
  document.getElementById("tf").style.width = (fail / TOTAL * 100) + "%";
  document.getElementById("tn").style.width = (na / TOTAL * 100) + "%";
  document.getElementById("cp").textContent = T(UI.pass) + " " + pass;
  document.getElementById("cf").textContent = T(UI.fail) + " " + fail;
  document.getElementById("cn").textContent = T(UI.na) + " " + na;
  document.getElementById("cr").textContent = T(UI.remain) + " " + (TOTAL - pass - fail - na);
  document.getElementById("empty").hidden = shown !== 0;
}

document.getElementById("q").addEventListener("input", refresh);
document.getElementById("filter").addEventListener("change", refresh);
document.getElementById("btnLang").addEventListener("click", () => {
  lang = lang === "fa" ? "en" : "fa";
  localStorage.setItem(LANG_KEY, lang);
  render();
});
document.getElementById("btnExpand").addEventListener("click", (e) => {
  const secs = [...document.querySelectorAll("section.sec")];
  const anyOpen = secs.some(s => !s.classList.contains("collapsed"));
  secs.forEach(s => s.classList.toggle("collapsed", anyOpen));
  e.target.textContent = anyOpen ? T(UI.expand) : T(UI.collapse);
});
document.getElementById("btnReset").addEventListener("click", () => {
  if (!confirm(T(UI.confirm))) return;
  state = {}; save(); refresh();
});
const topBtn = document.getElementById("top");
topBtn.addEventListener("click", () => window.scrollTo({top: 0, behavior: "smooth"}));
window.addEventListener("scroll", () => {
  topBtn.classList.toggle("show", window.scrollY > 500);
  let active = null;
  document.querySelectorAll("section.sec").forEach(s => {
    if (s.getBoundingClientRect().top <= 120) active = s.id;
  });
  document.querySelectorAll("#tocLinks a").forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + active));
});

render();
</script>
